<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 756" width="1600" height="756">
  <defs>
    <!-- Outer table drop shadow -->
    <filter id="tableDropShadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000000" flood-opacity="0.82"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Inner shadow from rail onto felt -->
    <filter id="feltInnerShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feOffset dx="0" dy="8"/>
      <feGaussianBlur stdDeviation="14" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="#000000" flood-opacity="0.72" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>

    <!-- Outer metallic rim gradient -->
    <linearGradient id="outerMetalRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3c434d"/>
      <stop offset="25%" stop-color="#1f242b"/>
      <stop offset="50%" stop-color="#12151a"/>
      <stop offset="80%" stop-color="#252b33"/>
      <stop offset="100%" stop-color="#0b0d10"/>
    </linearGradient>

    <!-- Padded dark leather rail gradient -->
    <linearGradient id="leatherRail" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#323741"/>
      <stop offset="12%" stop-color="#22262e"/>
      <stop offset="50%" stop-color="#15181e"/>
      <stop offset="88%" stop-color="#0e1014"/>
      <stop offset="100%" stop-color="#232830"/>
    </linearGradient>

    <!-- Top highlight on the padded leather rail -->
    <linearGradient id="railSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="22%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="80%" stop-color="#000000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </linearGradient>

    <!-- Inner dark gunmetal lip -->
    <linearGradient id="innerLip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#07090b"/>
      <stop offset="50%" stop-color="#1c2026"/>
      <stop offset="100%" stop-color="#2f3640"/>
    </linearGradient>

    <!-- Classic PokerStars Rich Green Felt Radial Gradient -->
    <radialGradient id="psGreenFelt" cx="50%" cy="48%" r="54%" fx="50%" fy="44%">
      <stop offset="0%" stop-color="#207d34"/>
      <stop offset="42%" stop-color="#166627"/>
      <stop offset="76%" stop-color="#0e4d1b"/>
      <stop offset="94%" stop-color="#093813"/>
      <stop offset="100%" stop-color="#06260d"/>
    </radialGradient>

    <!-- Clip path for rail seam lines -->
    <clipPath id="railClip">
      <path d="M 420,48 L 1180,48 A 372,330 0 0,1 1552,378 A 372,330 0 0,1 1180,708 L 420,708 A 372,330 0 0,1 48,378 A 372,330 0 0,1 420,48 Z
               M 436,108 L 1164,108 A 312,270 0 0,0 1476,378 A 312,270 0 0,0 1164,648 L 436,648 A 312,270 0 0,0 124,378 A 312,270 0 0,0 436,108 Z" clip-rule="evenodd"/>
    </clipPath>
  </defs>

  <!-- 1. Outer 3D Base / Rim with Drop Shadow -->
  <rect x="38" y="38" width="1524" height="680" rx="340" ry="340" fill="url(#outerMetalRim)" filter="url(#tableDropShadow)"/>

  <!-- 2. Main Padded Leather/Carbon Rail -->
  <rect x="46" y="46" width="1508" height="664" rx="332" ry="332" fill="url(#leatherRail)" stroke="#3e4552" stroke-width="2"/>
  <rect x="48" y="48" width="1504" height="660" rx="330" ry="330" fill="url(#railSheen)"/>

  <!-- 3. Segmented Rail Seams (PokerStars 6-Max / Spin & Go style rail joints) -->
  <g clip-path="url(#railClip)" opacity="0.55">
    <line x1="430" y1="0" x2="450" y2="200" stroke="#050608" stroke-width="5"/>
    <line x1="432" y1="0" x2="452" y2="200" stroke="#495261" stroke-width="1.5"/>

    <line x1="1170" y1="0" x2="1150" y2="200" stroke="#050608" stroke-width="5"/>
    <line x1="1172" y1="0" x2="1152" y2="200" stroke="#495261" stroke-width="1.5"/>

    <line x1="430" y1="756" x2="450" y2="556" stroke="#050608" stroke-width="5"/>
    <line x1="432" y1="756" x2="452" y2="556" stroke="#495261" stroke-width="1.5"/>

    <line x1="1170" y1="756" x2="1150" y2="556" stroke="#050608" stroke-width="5"/>
    <line x1="1172" y1="756" x2="1152" y2="556" stroke="#495261" stroke-width="1.5"/>

    <line x1="0" y1="240" x2="220" y2="290" stroke="#050608" stroke-width="5"/>
    <line x1="0" y1="242" x2="220" y2="292" stroke="#495261" stroke-width="1.5"/>

    <line x1="0" y1="516" x2="220" y2="466" stroke="#050608" stroke-width="5"/>
    <line x1="0" y1="514" x2="220" y2="464" stroke="#495261" stroke-width="1.5"/>

    <line x1="1600" y1="240" x2="1380" y2="290" stroke="#050608" stroke-width="5"/>
    <line x1="1600" y1="242" x2="1380" y2="292" stroke="#495261" stroke-width="1.5"/>

    <line x1="1600" y1="516" x2="1380" y2="466" stroke="#050608" stroke-width="5"/>
    <line x1="1600" y1="514" x2="1380" y2="464" stroke="#495261" stroke-width="1.5"/>
  </g>

  <!-- 4. Inner Padded Cushion Highlight Ring -->
  <rect x="64" y="64" width="1472" height="628" rx="314" ry="314" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>

  <!-- 5. Inner Bevel / Gunmetal Lip between Rail and Felt -->
  <rect x="112" y="102" width="1376" height="552" rx="276" ry="276" fill="url(#innerLip)" stroke="#050709" stroke-width="4"/>

  <!-- 6. PokerStars Green Felt Surface -->
  <rect x="122" y="110" width="1356" height="536" rx="268" ry="268" fill="url(#psGreenFelt)" filter="url(#feltInnerShadow)"/>

  <!-- 7. Subtle Inner Betting Line on Felt -->
  <rect x="158" y="142" width="1284" height="472" rx="236" ry="236" fill="none" stroke="#2ca044" stroke-opacity="0.16" stroke-width="2"/>

  <!-- 8. Subtle Center Watermark (Spin & Go / Spade Emblem) -->
  <g opacity="0.065" transform="translate(800, 368)" fill="#ffffff">
    <text x="0" y="14" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-weight="800" font-size="76" letter-spacing="6">SPIN &amp; GO</text>
    <text x="0" y="54" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-weight="700" font-size="18" letter-spacing="10">POKERCLUB ★</text>
  </g>
</svg>

