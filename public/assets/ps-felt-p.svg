<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 696 1120" width="696" height="1120">
  <defs>
    <filter id="tableDropShadowP" x="-10%" y="-8%" width="120%" height="116%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.82"/>
    </filter>
    <linearGradient id="leatherRailP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#323741"/>
      <stop offset="50%" stop-color="#15181e"/>
      <stop offset="100%" stop-color="#0d0f13"/>
    </linearGradient>
    <radialGradient id="psGreenFeltP" cx="50%" cy="48%" r="54%" fx="50%" fy="44%">
      <stop offset="0%" stop-color="#207d34"/>
      <stop offset="45%" stop-color="#166627"/>
      <stop offset="80%" stop-color="#0e4d1b"/>
      <stop offset="100%" stop-color="#06260d"/>
    </radialGradient>
  </defs>

  <!-- Outer Rim -->
  <rect x="26" y="26" width="644" height="1068" rx="322" ry="322" fill="#0d0f13" filter="url(#tableDropShadowP)"/>
  <!-- Padded Leather Rail -->
  <rect x="34" y="34" width="628" height="1052" rx="314" ry="314" fill="url(#leatherRailP)" stroke="#3e4552" stroke-width="2"/>
  <rect x="48" y="48" width="600" height="1024" rx="300" ry="300" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>
  <!-- Inner Lip -->
  <rect x="74" y="74" width="548" height="972" rx="274" ry="274" fill="#080a0d" stroke="#1e232a" stroke-width="3"/>
  <!-- Green Felt -->
  <rect x="82" y="82" width="532" height="956" rx="266" ry="266" fill="url(#psGreenFeltP)"/>
  <!-- Inner Betting Line -->
  <rect x="106" y="108" width="484" height="904" rx="242" ry="242" fill="none" stroke="#2ca044" stroke-opacity="0.16" stroke-width="2"/>
  <!-- Center Watermark -->
  <g opacity="0.065" transform="translate(348, 560)" fill="#ffffff">
    <text x="0" y="0" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-weight="800" font-size="42" letter-spacing="4">SPIN &amp; GO</text>
    <text x="0" y="30" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-weight="700" font-size="13" letter-spacing="6">POKERCLUB ★</text>
  </g>
</svg>

